name: PSI Monitor

on:
  workflow_call:
    inputs:
      site_url:
        required: true
        type: string
      mobile_threshold:
        required: false
        type: number
        default: 90
      desktop_threshold:
        required: false
        type: number
        default: 90
      context_files:
        description: 'Space-separated repo-relative file paths to include in Claude context'
        required: false
        type: string
        default: 'CLAUDE.md'
      schema_config:
        description: 'JSON mapping URLs to expected schema type arrays for validation'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      GOOGLE_PSI_API_KEY:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7          # caller's repo (context files + git for auto-fix PRs)

      - uses: actions/checkout@v7          # this workflows repo (script + deps)
        with:
          repository: doublewolfconsulting/workflows
          path: _wf

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: _wf/package-lock.json

      # Installs the playwright npm package (JavaScript API used by psi-monitor.mjs).
      - name: Install dependencies
        run: npm ci
        working-directory: _wf

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('_wf/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: _wf
        timeout-minutes: 2

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: _wf
        timeout-minutes: 2
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Run PSI monitor
        run: node _wf/scripts/psi-monitor.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PSI_API_KEY: ${{ secrets.GOOGLE_PSI_API_KEY }}
          SITE_URL: ${{ inputs.site_url }}
          MOBILE_THRESHOLD: ${{ inputs.mobile_threshold }}
          DESKTOP_THRESHOLD: ${{ inputs.desktop_threshold }}
          CONTEXT_FILES: ${{ inputs.context_files }}
          SCHEMA_CONFIG: ${{ inputs.schema_config }}
