name: PR Checks (Reusable)

# Called from individual repos via:
#   jobs:
#     checks:
#       uses: doublewolfconsulting/workflows/.github/workflows/pr-checks.yml@main
#       with:
#         prohibited_patterns: |
#           bad pattern|||Error message shown in annotation
#         required_patterns: |
#           must-exist pattern|||Message if pattern is missing

on:
  workflow_call:
    inputs:
      required_sections:
        description: >
          Comma-separated list of required PR body section headers.
        type: string
        default: "## Summary,## Test plan"

      branch_pattern:
        description: >
          Extended regex (grep -E) that branch names must match.
          Long-lived branches (main, development, staging) are always allowed.
        type: string
        default: "^(feature|feat|fix|docs|chore|refactor|test)/"

      doc_path_filter:
        description: >
          File path prefix to scope doc consistency checks.
        type: string
        default: "docs/"

      prohibited_patterns:
        description: >
          Newline-separated PATTERN|||MESSAGE pairs.
          PATTERN is case-insensitive grep -E. Fails if pattern IS found.
          Leave empty to skip.
        type: string
        default: ""

      required_patterns:
        description: >
          Newline-separated PATTERN|||MESSAGE pairs.
          PATTERN is case-insensitive grep -E. Fails if pattern is NOT found
          in ANY of the changed docs files. Use to assert things that must
          always be present (e.g. a canonical field name, a required section).
          Leave empty to skip.
        type: string
        default: ""

jobs:
  # ── 1. PR body ─────────────────────────────────────────────────────────────
  pr-body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const errors = [];

            // Required sections
            for (const section of `${{ inputs.required_sections }}`.split(',').map(s => s.trim()).filter(Boolean)) {
              if (!body.includes(section)) errors.push(`Missing required section: "${section}"`);
            }

            // Minimum length
            if (body.trim().length < 50) errors.push('PR body is too short — describe what changed and why');

            // No AI attribution
            for (const phrase of ['generated with claude', 'claude code', 'co-authored-by: claude', 'co-authored-by: anthropic']) {
              if (body.toLowerCase().includes(phrase)) errors.push(`PR body must not contain AI attribution ("${phrase}")`);
            }

            if (errors.length > 0) core.setFailed('PR body validation failed:\n' + errors.map(e => `  • ${e}`).join('\n'));
            else core.info('PR body OK');

  # ── 2. Branch naming ────────────────────────────────────────────────────────
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          case "$BRANCH" in
            main|development|staging|master) echo "Long-lived branch — skipping"; exit 0 ;;
          esac
          if ! echo "$BRANCH" | grep -qE "${{ inputs.branch_pattern }}"; then
            echo "::error::Branch '$BRANCH' does not match required pattern: ${{ inputs.branch_pattern }}"
            exit 1
          fi
          echo "Branch name OK: $BRANCH"

  # ── 3. Doc consistency ──────────────────────────────────────────────────────
  doc-consistency:
    name: Doc consistency
    runs-on: ubuntu-latest
    if: inputs.prohibited_patterns != '' || inputs.required_patterns != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed docs files
        id: changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep "^${{ inputs.doc_path_filter }}" \
            > changed_docs.txt || true

          if [ ! -s changed_docs.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No files under ${{ inputs.doc_path_filter }} changed — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changed docs files:"; cat changed_docs.txt
          fi

      - name: Check prohibited patterns
        if: steps.changed.outputs.skip == 'false' && inputs.prohibited_patterns != ''
        env:
          PATTERNS: ${{ inputs.prohibited_patterns }}
        run: |
          FAILED=0
          printf '%s\n' "$PATTERNS" > /tmp/prohibited.txt

          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            PATTERN="${line%%|||*}"; MESSAGE="${line##*|||}"

            while IFS= read -r f; do
              [[ -z "$f" || ! -f "$f" ]] && continue
              if grep -qiE "$PATTERN" "$f"; then
                echo "::error file=$f::$MESSAGE"
                grep -niE "$PATTERN" "$f" | head -5 | while IFS= read -r hit; do echo "    → $hit"; done
                FAILED=1
              fi
            done < changed_docs.txt
          done < /tmp/prohibited.txt

          [ "$FAILED" -eq 1 ] && { echo ""; echo "Prohibited pattern checks failed. See CLAUDE.md for ground-truth references."; exit 1; }
          echo "Prohibited pattern checks passed."

      - name: Check required patterns
        if: steps.changed.outputs.skip == 'false' && inputs.required_patterns != ''
        env:
          PATTERNS: ${{ inputs.required_patterns }}
        run: |
          FAILED=0
          printf '%s\n' "$PATTERNS" > /tmp/required.txt

          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            PATTERN="${line%%|||*}"; MESSAGE="${line##*|||}"

            while IFS= read -r f; do
              [[ -z "$f" || ! -f "$f" ]] && continue
              if ! grep -qiE "$PATTERN" "$f"; then
                echo "::error file=$f::$MESSAGE"
                FAILED=1
              fi
            done < changed_docs.txt
          done < /tmp/required.txt

          [ "$FAILED" -eq 1 ] && { echo ""; echo "Required pattern checks failed. See CLAUDE.md for ground-truth references."; exit 1; }
          echo "Required pattern checks passed."
