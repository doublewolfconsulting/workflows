name: PR Checks (Reusable)

# Called from individual repos via:
#   jobs:
#     checks:
#       uses: doublewolfconsulting/workflows/.github/workflows/pr-checks.yml@main
#       with:
#         prohibited_patterns: |
#           bad pattern|||Human-readable error message
#           another pattern|||Another message

on:
  workflow_call:
    inputs:
      required_sections:
        description: >
          Comma-separated list of required PR body section headers.
          Default checks for Summary and Test plan.
        type: string
        default: "## Summary,## Test plan"

      branch_pattern:
        description: >
          Extended regex (grep -E) that branch names must match.
          PRs against main/development/staging are always allowed.
        type: string
        default: "^(feature|feat|fix|docs|chore|refactor|test)/"

      doc_path_filter:
        description: >
          File path prefix used to scope doc consistency checks.
          Only changed files whose path starts with this value are checked.
        type: string
        default: "docs/"

      prohibited_patterns:
        description: >
          Newline-separated list of "PATTERN|||MESSAGE" pairs.
          PATTERN is a case-insensitive grep -E expression.
          MESSAGE is shown in the GitHub annotation when the pattern matches.
          Leave empty (default) to skip doc consistency checks entirely.
        type: string
        default: ""

jobs:
  # ── 1. PR body ─────────────────────────────────────────────────────────────
  pr-body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body ?? '';
            const errors = [];

            // Required sections
            const sections = `${{ inputs.required_sections }}`
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            for (const section of sections) {
              if (!body.includes(section)) {
                errors.push(`Missing required section: "${section}"`);
              }
            }

            // Minimum length
            if (body.trim().length < 50) {
              errors.push('PR body is too short — describe what changed and why');
            }

            // No AI/Claude attribution
            const lower = body.toLowerCase();
            const banned = [
              'generated with claude',
              'claude code',
              'co-authored-by: claude',
              'co-authored-by: anthropic',
            ];
            for (const phrase of banned) {
              if (lower.includes(phrase)) {
                errors.push(`PR body must not contain AI attribution ("${phrase}")`);
              }
            }

            if (errors.length > 0) {
              core.setFailed(
                'PR body validation failed:\n' +
                errors.map(e => `  • ${e}`).join('\n')
              );
            } else {
              core.info('PR body OK');
            }

  # ── 2. Branch naming ────────────────────────────────────────────────────────
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="${{ inputs.branch_pattern }}"

          # Long-lived branches are always fine
          case "$BRANCH" in
            main|development|staging|master) echo "Long-lived branch — skipping"; exit 0 ;;
          esac

          if ! echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "::error::Branch '$BRANCH' does not match required pattern: $PATTERN"
            echo "Valid prefixes: feature/, feat/, fix/, docs/, chore/, refactor/, test/"
            exit 1
          fi

          echo "Branch name OK: $BRANCH"

  # ── 3. Doc consistency ──────────────────────────────────────────────────────
  doc-consistency:
    name: Doc consistency
    runs-on: ubuntu-latest
    if: inputs.prohibited_patterns != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed docs files
        id: changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep "^${{ inputs.doc_path_filter }}" \
            > changed_docs.txt || true

          if [ ! -s changed_docs.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No files under ${{ inputs.doc_path_filter }} changed — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changed docs files:"
            cat changed_docs.txt
          fi

      - name: Run prohibited pattern checks
        if: steps.changed.outputs.skip == 'false'
        env:
          PATTERNS: ${{ inputs.prohibited_patterns }}
        run: |
          FAILED=0
          printf '%s\n' "$PATTERNS" > /tmp/patterns.txt

          while IFS= read -r line; do
            # Skip blank lines and comment lines
            [[ -z "$line" || "$line" == \#* ]] && continue

            PATTERN="${line%%|||*}"
            MESSAGE="${line##*|||}"

            while IFS= read -r filepath; do
              [[ -z "$filepath" || ! -f "$filepath" ]] && continue

              if grep -qiE "$PATTERN" "$filepath"; then
                echo "::error file=$filepath::$MESSAGE"
                grep -niE "$PATTERN" "$filepath" | head -5 | \
                  while IFS= read -r hit; do echo "    → $hit"; done
                FAILED=1
              fi
            done < changed_docs.txt

          done < /tmp/patterns.txt

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "One or more doc consistency checks failed."
            echo "See CLAUDE.md §'Documentation consistency checks' for ground-truth references."
            exit 1
          fi

          echo "All doc consistency checks passed."
