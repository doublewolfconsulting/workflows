name: Sync Markdown to Google Doc

on:
  workflow_call:
    inputs:
      md_file:
        description: Path to the markdown file (e.g. docs/prd.md)
        required: true
        type: string
      reference_doc:
        description: Optional path to a .docx reference template for Pandoc styling
        required: false
        type: string
        default: ""
      google_doc_id:
        description: Google Doc file ID to sync to
        required: true
        type: string
    secrets:
      WORKLOAD_IDENTITY_PROVIDER:
        description: Workload Identity Federation provider resource name
        required: true
      SERVICE_ACCOUNT_EMAIL:
        description: Google service account email
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6          # caller's repo (markdown source)

      - uses: actions/checkout@v6          # this workflows repo (Python scripts)
        with:
          repository: doublewolfconsulting/workflows
          path: _wf

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Install Pandoc
        run: |
          PANDOC_DEB_URL=$(curl -s https://api.github.com/repos/jgm/pandoc/releases/latest \
            | grep "browser_download_url.*amd64\.deb" \
            | cut -d '"' -f 4)
          curl -sL "$PANDOC_DEB_URL" -o pandoc.deb
          sudo dpkg -i pandoc.deb

      - name: Convert Markdown to DOCX
        run: |
          RESOURCE_PATH="$(dirname "${{ inputs.md_file }}")"
          if [ -n "${{ inputs.reference_doc }}" ]; then
            pandoc "${{ inputs.md_file }}" --resource-path="$RESOURCE_PATH" --from markdown+pipe_tables --reference-doc="${{ inputs.reference_doc }}" -o output.docx
          else
            pandoc "${{ inputs.md_file }}" --resource-path="$RESOURCE_PATH" --from markdown+pipe_tables -o output.docx
          fi

      - name: Install Python dependencies
        run: pip install --quiet google-auth==2.40.0 google-api-python-client==2.166.0 lxml==5.4.0

      - name: Post-process DOCX
        run: python3 _wf/scripts/sync_gdoc_postprocess.py

      - name: Upload to Google Drive
        env:
          GOOGLE_DOC_ID: ${{ inputs.google_doc_id }}
        run: python3 _wf/scripts/upload_gdoc.py
