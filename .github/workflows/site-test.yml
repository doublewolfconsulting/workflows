name: Site Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7          # caller's repo

      - uses: actions/checkout@v7          # workflows repo (script + playwright)
        with:
          repository: doublewolfconsulting/workflows
          path: _wf

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _wf/package-lock.json

      - name: Install caller dependencies
        run: npm ci

      - name: Install workflow dependencies
        run: npm ci
        working-directory: _wf

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('_wf/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: _wf
        timeout-minutes: 2

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: _wf
        timeout-minutes: 2
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build site
        run: npm run build

      - name: Serve dist
        # serve is managed by this workflow (in _wf/node_modules) so callers
        # do not need it in their own package.json. Direct binary path avoids
        # the npx install-on-demand overhead and warning.
        # serve handles extensionless URLs (serves faq.html for /faq);
        # Python's http.server does not, causing 404s on extensionless routes.
        run: _wf/node_modules/.bin/serve dist -p 3000 --no-clipboard &

      - name: Wait for server
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000 > /dev/null && echo "Server ready" && break
            sleep 1
          done

      - name: Run site tests
        # NODE_PATH makes Playwright (managed here) available to the caller's test script
        run: node scripts/site-test.mjs
        env:
          NODE_PATH: _wf/node_modules
