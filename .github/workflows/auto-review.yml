name: PR Review (Reusable)

# Recommended caller trigger:
#
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, synchronize, reopened, ready_for_review]
#
#   jobs:
#     review:
#       if: github.event.pull_request.draft == false
#       concurrency:
#         group: pr-review-${{ github.event.pull_request.number }}
#         cancel-in-progress: true
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#         id-token: write
#         actions: read
#       uses: doublewolfconsulting/workflows/.github/workflows/auto-review.yml@main
#       with:
#         additional_context: |
#           Repo-specific facts...
#         # Bedrock (preferred — no Anthropic credits consumed):
#         aws_role_arn: ${{ vars.AWS_BEDROCK_ROLE_ARN_STAGING }}
#         # Direct API (fallback):
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

on:
  workflow_call:
    inputs:
      additional_context:
        description: >
          Repo-specific context — ground-truth facts, coding standards,
          architecture notes. Passed directly to Claude as the source of truth
          (no repo files are read — single API call, predictable cost).
        type: string
        default: ''
      aws_role_arn:
        description: >
          IAM role ARN for Bedrock auth. When set, uses AWS Bedrock instead of
          the Anthropic API (no credits consumed). The role must have
          bedrock:InvokeModel on the target foundation model. If unset,
          ANTHROPIC_API_KEY is required.
        type: string
        default: ''
      bedrock_region:
        description: AWS region for the Bedrock API call (foundation model must be available there).
        type: string
        default: 'us-east-1'
      bedrock_model_id:
        description: Bedrock foundation model ID.
        type: string
        default: 'us.anthropic.claude-sonnet-4-6'
    secrets:
      ANTHROPIC_API_KEY:
        description: Anthropic API key. Required when aws_role_arn is not set.
        required: false

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout workflows repo
        uses: actions/checkout@v7
        with:
          repository: doublewolfconsulting/workflows
          path: _wf

      - name: Install dependencies
        run: npm ci
        working-directory: _wf

      - name: Configure AWS credentials (Bedrock)
        if: inputs.aws_role_arn != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.bedrock_region }}

      - name: Run PR review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_BEDROCK: ${{ inputs.aws_role_arn != '' }}
          BEDROCK_REGION: ${{ inputs.bedrock_region }}
          BEDROCK_MODEL_ID: ${{ inputs.bedrock_model_id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
        run: node _wf/scripts/pr-review.mjs
