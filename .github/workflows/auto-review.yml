name: PR Review (Reusable)

# Recommended caller trigger:
#
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, synchronize, reopened, ready_for_review]
#
#   jobs:
#     review:
#       if: github.event.pull_request.draft == false
#       concurrency:
#         group: pr-review-${{ github.event.pull_request.number }}
#         cancel-in-progress: true
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#         id-token: write
#         actions: read
#       uses: doublewolfconsulting/workflows/.github/workflows/auto-review.yml@main
#       with:
#         owner_handle: '@yourhandle'
#         additional_context: |
#           Repo-specific facts...
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

on:
  workflow_call:
    inputs:
      owner_handle:
        description: >
          GitHub handle to tag only when an issue cannot be resolved without
          human judgement (e.g. a business decision, ambiguous scope).
        type: string
        required: true
      additional_context:
        description: >
          Repo-specific context — ground-truth facts, coding standards,
          architecture notes. Claude reads the repo directly but this gives
          it fast orientation.
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        description: Anthropic API key (same key used by PSI monitor and template sync)
        required: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run automated Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-4-6 --max-turns 30"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in this repository.

            PR: `${{ github.head_ref }}` → `${{ github.base_ref }}`
            Title: ${{ github.event.pull_request.title }}

            ${{ inputs.additional_context != '' && format('## Repo context (ground truth)\n\n{0}\n', inputs.additional_context) || '' }}
            ## Steps

            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to see the changes.
            2. Check facts in the diff against the repo context above — that is your primary
               ground truth. Only read additional files (CLAUDE.md, docs/prd.md,
               docs/data-pipeline.md, docs/field-specifications.md) if a specific claim
               in the diff is NOT covered by the context above and you need to verify it.
            3. Post a review using one of:
               - `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "..."`
               - `gh pr review ${{ github.event.pull_request.number }} --approve --body "LGTM"`

            For each problem found, state: file · line · what is wrong · correct value ·
            which source confirms it. Do not tag ${{ inputs.owner_handle }} unless the
            issue requires a business or scope decision only they can make.

            Only tag ${{ inputs.owner_handle }} for genuine ambiguity (conflicting docs,
            scope question, business decision) — explain exactly what needs resolving.
