name: PR Review (Reusable)

# Recommended caller trigger:
#
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, synchronize, reopened, ready_for_review]
#
#   jobs:
#     review:
#       if: github.event.pull_request.draft == false
#       concurrency:
#         group: pr-review-${{ github.event.pull_request.number }}
#         cancel-in-progress: true
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#         id-token: write
#         actions: read
#       uses: doublewolfconsulting/workflows/.github/workflows/auto-review.yml@main
#       with:
#         owner_handle: '@yourhandle'
#         additional_context: |
#           Repo-specific facts...
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

on:
  workflow_call:
    inputs:
      owner_handle:
        description: >
          GitHub handle to tag only when an issue cannot be resolved without
          human judgement (e.g. a business decision, ambiguous scope).
        type: string
        required: true
      additional_context:
        description: >
          Repo-specific context — ground-truth facts, coding standards,
          architecture notes. Passed directly to Claude as the source of truth
          (no repo files are read — single API call, predictable cost).
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        description: Anthropic API key (same key used by PSI monitor and template sync)
        required: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout workflows repo
        uses: actions/checkout@v7
        with:
          repository: doublewolfconsulting/workflows
          path: _wf

      - name: Install dependencies
        run: npm ci
        working-directory: _wf

      - name: Run PR review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          OWNER_HANDLE: ${{ inputs.owner_handle }}
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
        run: node _wf/scripts/pr-review.mjs
