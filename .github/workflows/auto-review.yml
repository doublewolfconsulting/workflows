name: Auto Review (Reusable)

# Recommended caller trigger:
#
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, synchronize, reopened, ready_for_review]
#
#   jobs:
#     review:
#       if: github.event.pull_request.draft == false
#       concurrency:
#         group: auto-review-${{ github.event.pull_request.number }}
#         cancel-in-progress: true
#       uses: doublewolfconsulting/workflows/.github/workflows/auto-review.yml@main
#       with:
#         owner_handle: '@yourhandle'
#         additional_context: |
#           Repo-specific facts...
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  workflow_call:
    inputs:
      owner_handle:
        description: >
          GitHub handle to tag only when an issue cannot be resolved without
          human judgement (e.g. a business decision, ambiguous scope).
        type: string
        required: true
      additional_context:
        description: >
          Repo-specific context — ground-truth facts, coding standards,
          architecture notes. Claude reads the repo directly but this gives
          it fast orientation.
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token (Claude Max subscription, not API-billed)
        required: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run automated Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            ${{ inputs.additional_context != '' && format('\n\nAdditional context for this repo:\n\n{0}', inputs.additional_context) || '' }}

            ---

            For any changed file, also read the source-of-truth docs (CLAUDE.md,
            docs/prd.md, docs/data-pipeline.md, docs/field-specifications.md)
            to verify factual consistency.

            **Your job is to fix issues, not just report them.**

            For any problem you find — typos, wrong facts, stale references,
            inconsistencies, style issues — fix it directly by editing the file
            and committing to this branch. Then approve the PR.

            Only escalate to ${{ inputs.owner_handle }} when the issue genuinely
            requires human judgement: a business decision, an ambiguous scope
            question, or a change that conflicts with information you don't have
            access to. In that case submit REQUEST CHANGES, explain the specific
            question clearly, and tag ${{ inputs.owner_handle }}.

            When everything is correct (whether you fixed things or not):
            submit APPROVED. No need to involve anyone.
